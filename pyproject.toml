[project]
name = "fetchbridge"
version = "1.8.3"
description = "Inotify-basierte Bridge zwischen Verzeichnissen (RO/RW-Erkennung)"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "chaos7x"},
]
keywords = ["inotify", "file-watcher", "media-pipeline", "automation", "daemon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "inotify",
]

[project.urls]
Homepage = "https://github.com/chaos7x/fetchbridge"
Repository = "https://github.com/chaos7x/fetchbridge"
Issues = "https://github.com/chaos7x/fetchbridge/issues"

[project.scripts]
fetchbridge = "fetchbridge.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "LOG", "BLE", "PLW1510", "DTZ", "SIM", "PIE", "C4", "EXE", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
