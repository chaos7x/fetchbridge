[project]
name = "fetchbridge"
version = "1.2.0"
description = "Inotify-basierte Bridge zwischen Verzeichnissen (RO/RW-Erkennung)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "inotify",
]

[project.scripts]
fetchbridge = "fetchbridge.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "LOG", "BLE", "PLW1510", "DTZ", "SIM", "PIE", "C4", "EXE"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
