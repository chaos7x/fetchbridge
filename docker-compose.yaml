services:
  mediadog:
    image: ghcr.io/chaos7x/mediadog:${IMAGE_VERSION:-latest}
    container_name: mediadog
    hostname: mediadog
    user: "11107:11108"
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - PYTHONUNBUFFERED=1
      - HOME=/tmp
    env_file:
      - .env
    volumes:
      # Optionales App-Volume (bei Bedarf einkommentieren)
      # - app:/app:ro
      # Eingangs-Ordner aus dem streamlink-recorder
      - storage-source:/media/out:rw
      # Ausgangs-Ordner für den yt-upload
      - storage-target:/media/in:rw

# ==========================================
# SEPARATE VOLUMES DEKLARATION
# ==========================================
volumes:
  # --- App Volume (für externe mover.py / Skripte) ---
  app:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./app

  # --- Bind Mounts für Daten ---
  storage-source:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/docker/tw-recorder/videos

  storage-target:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/docker/yt-upload/videos/in

